# Flat config for tools/train_windows.py; CLI flags override these values.
# Fill actual epoch-second boundaries before production training.
data: data/windows_v1
out: runtime/pretrain_windows_v1
train_end: null
val_start: null
val_end: null
epochs: 2
batch_size: 8                 # full road snapshots, NOT individual curves
workers: 0
max_batches: 0               # 0 = whole split; set e.g. 4 for smoke only
d_model: 128
heads: 4
layers: 2
group_layers: 2
time_features: none          # design-doc f_i = [dt, ratio, observed]; curve/bin add coarse age
target_transform: log1p      # log1p (default) / raw ablation on dt-per-bin
bin_size_m: 10.0             # must match the production bin grid; scales ratio and the target
decoder_input: hidden        # hidden = level-2 token state (design doc) / cls = pure CLS bottleneck
probe_batches: 4             # val batches for the aggregate-ablation branch-death monitor
age_bucket_seconds: 60
max_curves_per_snapshot: 512  # fail clearly on oversized groups; cap passages upstream
mask_ratio: 0.5              # span fallback for single-trajectory snapshots only
whole_pass_probability: 0.5  # main path: hide whole trajectories (>=1 hidden, >=1 visible); 0 = span-only
seed: 42
