# Flat config for tools/train_windows.py; CLI flags override these values.
# Fill actual epoch-second boundaries before production training.
data: data/windows_v1
out: runtime/pretrain_windows_v1
train_end: null
val_start: null
val_end: null
epochs: 2
batch_size: 8                 # full road snapshots, NOT individual curves
workers: 0
max_batches: 0               # 0 = whole split; set e.g. 4 for smoke only
d_model: 128
heads: 4
layers: 2
group_layers: 2
time_features: curve         # none / curve (default) / bin (experimental)
age_bucket_seconds: 60
max_curves_per_snapshot: 512  # fail clearly on oversized groups; cap passages upstream
mask_ratio: 0.5
whole_pass_probability: 0.5
seed: 42
